<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim da dupla · Git passo a passo</title>
<style>
:root{
  --bg:#0d1220; --panel:#151c2e; --panel2:#1b2439; --line:#27324c;
  --tx:#e9eef8; --mut:#9aa8c4; --dim:#61708f;
  --A:#4da3ff; --B:#ff9f43; --C:#2ed573; --Y:#ffd43b; --R:#ff6b6b; --G:#5be38f;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070a12;color:var(--tx);font-family:var(--sans);overflow:hidden}
#wrap{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;flex:none;transform-origin:center center;
  background:radial-gradient(1200px 600px at 85% -10%, #1a2950 0%, transparent 60%), var(--bg);
  border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0;padding:44px 56px 36px;display:none;flex-direction:column}
.slide.active{display:flex;animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* header */
.hd{display:flex;align-items:baseline;gap:16px;margin-bottom:22px}
.tag{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);background:var(--Y);padding:5px 12px;border-radius:999px;white-space:nowrap}
.tag.blue{background:var(--A)} .tag.orange{background:var(--B)} .tag.green{background:var(--C)} .tag.red{background:var(--R)}
h1{font-size:60px;max-width:760px;line-height:1.03;letter-spacing:-.02em}
h2{font-size:38px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:20px;margin-top:-10px;margin-bottom:20px}
code,kbd{font-family:var(--mono);font-size:.92em;background:#0a0e18;border:1px solid var(--line);padding:1px 7px;border-radius:6px}
kbd{border-bottom-width:3px}
mark{background:var(--Y);color:#1a1400;padding:0 4px;border-radius:4px}
b{color:#fff}
.A{color:var(--A)} .B{color:var(--B)} .C{color:var(--C)}

/* fragments */
.f{opacity:0;transform:translateY(10px);transition:opacity .35s, transform .35s}
.f.on{opacity:1;transform:none}

/* step grids */
.grid{flex:1;display:grid;gap:22px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;transition:opacity .3s, filter .3s}
.col.dim{opacity:.28;filter:grayscale(.7)}
.who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:10px}
.dot{width:14px;height:14px;border-radius:50%}
.who .me{margin-left:auto;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--Y);color:#000;display:none}
.col.mine .who .me{display:inline-block}

.term{flex:1;min-height:0;background:#090d16;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:7px;padding:9px 14px;background:#111827;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
.bar i{width:11px;height:11px;border-radius:50%;background:#3a4560;display:inline-block}
.bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{margin-left:8px}
.term.browser .bar span{background:#0a0e18;border:1px solid var(--line);border-radius:6px;padding:2px 12px;flex:1;color:var(--mut)}
.body{flex:1;overflow:auto;padding:14px 16px;scroll-behavior:smooth}
.body::-webkit-scrollbar{width:8px}.body::-webkit-scrollbar-thumb{background:#2a3550;border-radius:4px}

.ln{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;margin-bottom:14px}
.n{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--bg);background:var(--mut);border-radius:6px;height:22px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.colA .n{background:var(--A)} .colB .n{background:var(--B)} .colC .n{background:var(--C)} .colAB .n{background:#c7b8ff}
.cmd{font-family:var(--mono);font-size:19px;color:#fff;white-space:pre-wrap;word-break:break-word}
.cmd::before{content:"$ ";color:#55cc88}
.cmd.typing::after{content:"▋";color:#9fb0cf;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.why{grid-column:2;font-size:15px;color:var(--mut);line-height:1.35}
.out{grid-column:2;font-family:var(--mono);font-size:14px;line-height:1.45;color:#a7b4cc;background:#0e1422;border-left:3px solid #2c3a5a;padding:6px 10px;border-radius:4px;white-space:pre-wrap;opacity:0;transition:opacity .4s}
.ln.done .out{opacity:1}
.ln .why{opacity:0;transition:opacity .4s}
.ln.done .why{opacity:1}
.out .ok{color:var(--G);font-weight:700}
.out .bad{color:var(--R);font-weight:700}
.out .mod{color:var(--B)}
.act{grid-column:2;font-size:18px;line-height:1.4}
.act::before{content:"✎ ";color:#c7b8ff}
.browser .act::before{content:"🖱 "}
.ln.wait{grid-template-columns:1fr}
.waitcard{border:2px dashed var(--Y);background:rgba(255,212,59,.08);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.waitcard .ic{font-size:26px;line-height:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.waitcard strong{display:block;color:var(--Y);font-size:19px;letter-spacing:.03em}
.waitcard p{color:#e9e3c6;font-size:15px;margin-top:2px;line-height:1.35}

.note{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:17px;line-height:1.4;background:var(--panel);border:1px solid var(--line);display:flex;gap:12px;align-items:center}
.note .ic{font-size:24px}
.note.y{border-color:rgba(255,212,59,.5);background:rgba(255,212,59,.07)}
.note.r{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.07)}
.note.g{border-color:rgba(91,227,143,.5);background:rgba(91,227,143,.07)}

/* cover */
.cover{justify-content:center}
.cover .kicker{font-size:18px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
.cover .lead{font-size:24px;color:var(--mut);margin-top:22px;max-width:720px;line-height:1.4}
.cover .hint{position:absolute;bottom:40px;left:56px;color:var(--dim);font-size:17px}
.gitart{position:absolute;right:20px;top:160px;width:340px;height:420px}
.gitart .rail{position:absolute;left:60px;top:20px;bottom:20px;width:6px;background:#2a3550;border-radius:3px}
.gitart .cm{position:absolute;left:40px;width:46px;height:46px;border-radius:50%;border:6px solid var(--bg);animation:drop .6s cubic-bezier(.3,1.5,.5,1) both}
.gitart .lbl{position:absolute;left:100px;font-family:var(--mono);font-size:15px;color:var(--mut);animation:fadein .5s both;white-space:nowrap}
@keyframes drop{from{transform:translateY(-40px) scale(.3);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateX(-10px)}}

/* files */
.files{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:6px}
.file{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;overflow:hidden}
.file::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c)}
.file h3{font-family:var(--mono);font-size:26px;margin-bottom:6px}
.file .own{font-weight:800;color:var(--c);font-size:17px;margin-bottom:12px}
.file pre{font-family:var(--mono);font-size:16px;background:#090d16;border-radius:10px;padding:12px;color:#c9d4ea;line-height:1.5}
.file pre .cmt{color:#6f80a3}
.file p{margin-top:12px;color:var(--mut);font-size:16px;line-height:1.4}
.flowline{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:26px;font-size:20px;color:var(--mut)}
.flowline .pill{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;color:#fff}

/* rules */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.rule .big{font-size:34px;margin-bottom:8px}
.rule h3{font-size:21px;margin-bottom:6px}
.rule p{color:var(--mut);font-size:16px;line-height:1.4}
.rule.no{border-color:rgba(255,107,107,.45)}
.rule.no h3{color:var(--R)}

/* email mock */
.mock{background:#f6f8fa;color:#1f2328;border-radius:14px;overflow:hidden;border:1px solid #d0d7de}
.mock .mh{background:#24292f;color:#fff;padding:10px 16px;font-size:14px;display:flex;gap:10px;align-items:center}
.mock .mb{padding:18px 22px;font-size:16px}
.mock h4{font-size:20px;margin-bottom:10px;border-bottom:1px solid #d0d7de;padding-bottom:8px}
.toggle{display:flex;align-items:center;gap:12px;margin:12px 0}
.sw{width:46px;height:26px;border-radius:13px;background:#d0d7de;position:relative;transition:background .4s}
.sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .4s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mock.onn .sw{background:#1f883d}.mock.onn .sw::after{left:23px}
.noreply{font-family:var(--mono);background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:16px}
.noreply mark{background:#ffe066}
.paper{background:#fffbe6;color:#3b3200;border-radius:4px;padding:16px 18px;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:19px;transform:rotate(-2deg);box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* roles */
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
.rbtn{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:24px 18px;color:var(--tx);cursor:pointer;text-align:left;font-family:inherit;transition:transform .15s,border-color .2s, background .2s}
.rbtn:hover{transform:translateY(-4px)}
.rbtn .L{font-size:58px;font-weight:900;line-height:1}
.rbtn h3{font-size:22px;margin:8px 0 6px}
.rbtn p{color:var(--mut);font-size:15px;line-height:1.4}
.rbtn.sel{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 12%, var(--panel))}

/* cycle */
.cycle{display:flex;align-items:stretch;gap:10px;margin-top:20px}
.cstep{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;transition:all .3s;position:relative}
.cstep .ic{font-size:34px}
.cstep code{display:inline-block;margin:10px 0 8px;font-size:15px}
.cstep p{color:var(--mut);font-size:15px;line-height:1.35}
.cstep.hot{border-color:var(--Y);transform:translateY(-8px);box-shadow:0 12px 30px rgba(255,212,59,.18)}
.arrow{align-self:center;color:var(--dim);font-size:24px}

/* flow diagram */
.flow{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:0;align-items:start;position:relative;height:330px;margin-top:4px}
.node{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 36px;min-height:290px;display:flex;flex-direction:column;align-items:center;position:relative}
.node h4{font-size:18px;margin-bottom:12px}
.node.hub{border-color:#3d4a6b;background:#161f35}
.stack{display:flex;flex-direction:column-reverse;gap:8px;width:100%;align-items:center}
.chip{font-family:var(--mono);font-weight:700;font-size:16px;padding:7px 12px;border-radius:9px;width:150px;text-align:center}
.chip.base{background:#2a3550;color:#c9d4ea}
.chip.a{background:var(--A);color:#001428}
.chip.b{background:var(--B);color:#2a1400}
.flow .h1,.flow .h2,.flow .p1{display:none}
.flow.s1 .h1,.flow.s4 .h2,.flow.s3 .p1{display:block;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.flow .p1{order:0}
.flow .pb{order:1}
.xbad{position:absolute;inset:auto 10px 10px 10px;background:rgba(255,107,107,.15);border:2px solid var(--R);color:var(--R);font-weight:800;border-radius:10px;padding:8px;text-align:center;font-size:16px;opacity:0;transform:scale(.8);transition:all .3s}
.flow.at2 .xbad{opacity:1;transform:none;animation:shake .5s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arw{position:absolute;top:120px;height:4px;border-radius:2px;opacity:0;transition:opacity .3s}
.arw::after{content:"";position:absolute;top:-8px;border:10px solid transparent}
.arw.l2r{left:calc(33.3% - 52px);width:90px;background:var(--A)}
.arw.l2r::after{right:-16px;border-left-color:var(--A)}
.arw.r2l{right:calc(33.3% - 52px);width:90px;background:var(--B)}
.arw.r2l::after{left:-16px;border-right-color:var(--B)}
.arw.back{right:calc(33.3% - 52px);width:90px;background:var(--A);top:170px}
.arw.back::after{right:-16px;border-left-color:var(--A)}
.arw.bad{background:var(--R)} .arw.bad::after{border-right-color:var(--R)}
.flow.at1 .ar1,.flow.at2 .ar2,.flow.at3 .ar3,.flow.at4 .ar4{opacity:1;animation:flash 1s ease-in-out infinite}
@keyframes flash{50%{opacity:.35}}
.arw b{position:absolute;top:-28px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:14px;color:#fff;font-weight:700}
.caps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:10px}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.4;color:var(--mut)}
.cap b{display:block;font-size:17px;margin-bottom:4px}
.cap .k{font-family:var(--mono);font-size:13px;color:var(--dim)}

/* delivery */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.dcard .ic{font-size:36px}
.dcard h3{font-size:22px;margin:8px 0}
.dcard p{color:var(--mut);font-size:16px;line-height:1.4}
.dcard code{font-size:14px}

/* troubleshoot */
.ts{flex:1;display:grid;grid-template-columns:430px 1fr;gap:20px;min-height:0}
.tsl{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:6px}
.tsl::-webkit-scrollbar{width:8px}.tsl::-webkit-scrollbar-thumb{background:#2a3550;border-radius:4px}
.tsb{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--tx);cursor:pointer;font-family:inherit;font-size:16px;line-height:1.3;display:flex;gap:10px;align-items:center;transition:all .2s}
.tsb:hover{border-color:#41507a}
.tsb.sel{border-color:var(--Y);background:rgba(255,212,59,.08)}
.tsb .e{font-size:20px}
.tsb small{display:block;color:var(--dim);font-family:var(--mono);font-size:12.5px;margin-top:2px}
.tsd{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 26px;overflow:auto}
.tsd h3{font-size:26px;margin-bottom:12px}
.tsd .msg{font-family:var(--mono);font-size:15px;background:#090d16;border-left:4px solid var(--R);padding:10px 12px;border-radius:6px;color:#ffb3b3;white-space:pre-wrap;margin-bottom:16px}
.tsd .lbl{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:14px 0 6px}
.tsd .lbl.why{color:var(--B)} .tsd .lbl.fix{color:var(--G)}
.tsd p{font-size:18px;line-height:1.45;color:#d5ddee}
.tsd ol{margin-left:22px;font-size:18px;line-height:1.5}
.tsd ol li{margin:6px 0}
.tsd .tcode{font-family:var(--mono);background:#090d16;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:16px;color:#fff;display:block;margin:6px 0}
.tsd .tcode::before{content:"$ ";color:#55cc88}
.tsd.anim{animation:enter .35s}

/* final */
.checks{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.chk{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:20px}
.chk .bx{width:34px;height:34px;border-radius:9px;border:2px solid var(--G);display:flex;align-items:center;justify-content:center;color:var(--G);font-size:22px;font-weight:900;flex:none}
.chk.on .bx{animation:pop .4s}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#0b0f1a;border-top:1px solid #1d2640;z-index:5}
#nav button{background:#161e31;border:1px solid #27324c;color:var(--tx);border-radius:10px;height:38px;padding:0 14px;font-size:15px;cursor:pointer;font-family:inherit}
#nav button:hover{background:#1f2942}
#prog{flex:1;height:6px;background:#1a2238;border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--A),var(--C));transition:width .4s}
#count{font-family:var(--mono);color:var(--mut);font-size:14px;min-width:70px;text-align:center}
#roleChip{font-weight:800}
#menu{position:fixed;inset:0 0 56px 0;background:rgba(5,8,15,.92);z-index:4;display:none;align-items:center;justify-content:center}
#menu.open{display:flex}
#menu .mg{display:grid;grid-template-columns:repeat(3, 300px);gap:10px;max-height:80vh;overflow:auto}
#menu button{text-align:left;background:#151c2e;border:1px solid #27324c;color:var(--tx);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:15px;font-family:inherit}
#menu button span{color:var(--dim);font-family:var(--mono);margin-right:8px}
#menu button.cur{border-color:var(--Y)}
.hintkey{position:absolute;right:24px;bottom:14px;font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="deck"></div></div></div>
<div id="menu"><div class="mg" id="mg"></div></div>
<div id="nav">
  <button id="bPrev" title="Voltar (←)">◀</button>
  <button id="bNext" title="Avançar (→ ou espaço)">Avançar ▶</button>
  <div id="prog"><i></i></div>
  <span id="count">1/1</span>
  <button id="roleChip" title="Trocar papel">Papel: todos</button>
  <button id="bMenu" title="Índice">☰ Índice</button>
  <button id="bFull" title="Tela cheia (F)">⛶</button>
</div>

<script>
/* ===================== CONTEÚDO ===================== */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl = s => esc(s).replace(/\{([^}]+)\}/g,'<mark>$1</mark>');      // {X} = trocar pelo seu valor
const plain = s => s.replace(/[{}]/g,'');
function colorOut(o){
  return esc(o).split('\n').map(l=>{
    if(/rejected|error|fatal/i.test(l)) return '<span class="bad">'+l+'</span>';
    if(/working tree clean|Successfully rebased|Aprovado|Media: 60\.0/.test(l)) return '<span class="ok">'+l+'</span>';
    if(/modified:/.test(l)) return '<span class="mod">'+l+'</span>';
    return l;
  }).join('\n');
}

const OUT = {
  clean:"On branch main\nYour branch is up to date with 'origin/main'.\nnothing to commit, working tree clean",
  log:"1a2b3c4 situacao: aprova com 60 ou mais\n5c6d7e8 media: calcula a media\n8d4b7e2 situacao: escreve o autor\n3f2a1c9 media: escreve o autor\n9f8e7d6 Initial commit",
  run:"Nota 1: 70\nNota 2: 50\nMedia: 60.0\nSituacao: Aprovado\nFalta: ?",
  runTrio:"Nota 1: 70\nNota 2: 50\nMedia: 60.0\nSituacao: Aprovado\nFalta: 0"
};

const SLIDES = [
/* 0 capa */
{title:'Capa', html:`
<div class="slide cover">
  <div class="kicker">IFRN · Introdução à Programação</div>
  <h1>Boletim da dupla<br><span style="color:var(--A)">Git</span> em <span style="color:var(--B)">dupla</span>, passo a passo</h1>
  <p class="lead">Um programa de 4 arquivos. Cada um escreve <b>um arquivo só</b>. Siga um passo por vez, sem pular.</p>
  <div class="gitart">
    <div class="rail"></div>
    <div class="cm" style="top:330px;background:#2a3550;animation-delay:.2s"></div><div class="lbl" style="top:342px;animation-delay:.3s">Initial commit</div>
    <div class="cm" style="top:250px;background:var(--A);animation-delay:.6s"></div><div class="lbl" style="top:262px;animation-delay:.7s">media: escreve o autor</div>
    <div class="cm" style="top:170px;background:var(--B);animation-delay:1s"></div><div class="lbl" style="top:182px;animation-delay:1.1s">situacao: escreve o autor</div>

{title:'O que vamos fazer', html:`

      <pre>n1 = ...  n2 = ...
media(n1, n2)
situacao(m)
falta(m)</pre><p>Ninguém mexe. Ele lê as notas e chama as três funções.</p></div>
    <div class="file f" style="--c:var(--A)"><h3>media.py</h3><div class="own">Aluno A</div>
      <pre><span class="cmt"># Autor:</span>
def media(n1, n2):
    return 0</pre><p>Devolve a <b>média</b> das duas notas.</p></div>
    <div class="file f" style="--c:var(--B)"><h3>situacao.py</h3><div class="own">Aluno B</div>
      <pre><span class="cmt"># Autor:</span>
def situacao(m):
    return "?"</pre><p><b>"Aprovado"</b> se a média for 60 ou mais. Senão, <b>"Reprovado"</b>.</p></div>
    <div class="file f" style="--c:var(--C)"><h3>falta.py</h3><div class="own">Aluno C · só no trio</div>
      <pre><span class="cmt"># Autor:</span>
def falta(m):

  </div>
  <div class="flowline f"><span class="pill">70, 50</span> → <span class="pill A">media()</span> → <span class="pill">60.0</span> → <span class="pill B">situacao()</span> → <span class="pill" style="color:var(--G)">Aprovado</span></div>
  <div class="flowline f" style="margin-top:12px"><span class="pill">60.0</span> → <span class="pill C">falta()</span> → <span class="pill" style="color:var(--G)">0</span> <span style="font-size:16px">(quantos pontos faltam para 60)</span></div>
  <div class="note g f"><span class="ic">💡</span>Cada um em um arquivo diferente = <b>sem conflito</b>. É esse o segredo da atividade.</div>
</div>`},

/* 2 regras */
{title:'Regras de ouro', html:`
<div class="slide">
  <div class="hd"><span class="tag red">Regras</span><h2>6 regras de ouro</h2></div>
  <div class="rules">
    <div class="rule f"><div class="big">📄</div><h3>Só mexa no SEU arquivo</h3><p>A edita só <code>media.py</code>. B edita só <code>situacao.py</code>. No trio, C edita só <code>falta.py</code>.</p></div>
    <div class="rule f"><div class="big">🎯</div><h3><code>git add</code> com o nome</h3><p>Sempre <code>git add media.py</code> (ou <code>situacao.py</code>, ou <code>falta.py</code>).</p></div>
    <div class="rule no f"><div class="big">⛔</div><h3>Nunca <code>git add .</code></h3><p>Ele envia tudo, até o que não é seu.</p></div>
    <div class="rule f"><div class="big">📸</div><h3>Commit antes do pull</h3><p><code>git status</code> limpo antes de <code>git pull</code>.</p></div>
    <div class="rule f"><div class="big">⬇️⬆️</div><h3>Pull antes do push</h3><p>Primeiro <code>git pull</code>, depois <code>git push</code>.</p></div>
    <div class="rule no f"><div class="big">🖥️</div><h3>Nunca <code>--global</code></h3><p>O computador do laboratório é de todo mundo.</p></div>
  </div>
  <div class="note y f"><span class="ic">🟨</span>O que estiver em <mark>amarelo</mark> você troca pelo seu valor. Um cartão <b style="color:var(--Y)">⏸ ESPERE</b> é uma parada: só continue quando o colega avisar.</div>

/* 5 ciclo */
{title:'O ciclo do Git', html:`
<div class="slide">
  <div class="hd"><span class="tag">Ideia central</span><h2>Toda vez que mudar seu arquivo, faça este ciclo</h2></div>
  <p class="sub">Você vai repetir isso algumas vezes. Decore a ordem.</p>
  <div class="cycle" id="cyc">
    <div class="cstep"><div class="ic">✏️</div><code>Ctrl+S</code><p>Edite e <b>salve</b> o seu arquivo</p></div><div class="arrow">→</div>
    <div class="cstep"><div class="ic">🔍</div><code>git status</code><p>Confira: só o <b>seu</b> arquivo mudou?</p></div><div class="arrow">→</div>
    <div class="cstep"><div class="ic">🎯</div><code>git add ARQ</code><p>Separe o seu arquivo</p></div><div class="arrow">→</div>
    <div class="cstep"><div class="ic">📸</div><code>git commit</code><p>Tire a “foto” com uma mensagem</p></div><div class="arrow">→</div>
    <div class="cstep"><div class="ic">⬇️</div><code>git pull</code><p>Traga o que o colega enviou</p></div><div class="arrow">→</div>
    <div class="cstep"><div class="ic">⬆️</div><code>git push</code><p>Envie ao GitHub e avise: <b>“Enviei!”</b></p></div>
  </div>
  <div class="note f" style="margin-top:34px"><span class="ic">🧠</span><div><b>commit</b> = foto salva no <b>seu</b> computador. &nbsp; <b>push</b> = manda as fotos para o GitHub. &nbsp; <b>pull</b> = baixa as fotos do colega.</div></div>
</div>`},

/* 10 diagrama */
{title:'Por que o push do B foi recusado?', html:`
<div class="slide">
  <div class="hd"><span class="tag orange">Entenda</span><h2>Por que o push do B foi recusado?</h2></div>
  <div class="flow" id="flow">
    <div class="node"><h4 class="A">💻 PC do A</h4><div class="stack"><span class="chip base">Initial</span><span class="chip a">A1</span></div></div>
    <div class="node hub"><h4>☁️ GitHub</h4><div class="stack"><span class="chip base">Initial</span><span class="chip a h1">A1</span><span class="chip b h2">B1</span></div><div class="xbad">✕ recusado: falta o A1 no seu PC</div></div>
    <div class="node"><h4 class="B">💻 PC do B</h4><div class="stack"><span class="chip base" style="order:-1">Initial</span><span class="chip a p1">A1</span><span class="chip b pb">B1</span></div></div>
    <div class="arw l2r ar1"><b>push</b></div>
    <div class="arw r2l bad ar2"><b>push ✕</b></div>
    <div class="arw back ar3"><b>pull</b></div>
    <div class="arw r2l ar4"><b>push ✓</b></div>
  </div>
  <div class="caps">
    <div class="cap f" data-flow="1"><span class="k">passo 3.6</span><b class="A">A faz push</b>O GitHub recebe a foto A1.</div>
    <div class="cap f" data-flow="2"><span class="k">passo 3.7</span><b style="color:var(--R)">B tenta push</b>Recusado: o B não tem o A1.</div>
    <div class="cap f" data-flow="3"><span class="k">passo 4.1</span><b class="B">B faz pull</b>Traz o A1 e coloca o B1 por cima.</div>
    <div class="cap f" data-flow="4"><span class="k">passo 4.2</span><b style="color:var(--G)">B faz push</b>Agora o GitHub aceita!</div>
  </div>
</div>`},

const ROLE_NAME = {A:'Aluno A', B:'Aluno B', C:'Aluno C', AB:'Os dois (A e B)'};
const ROLE_COLOR = {A:'var(--A)', B:'var(--B)', C:'var(--C)', AB:'#c7b8ff'};

function itemHTML(it, n, o){
  if(it.wait) return `<div class="ln wait f" data-o="${o}"><div class="waitcard"><span class="ic">⏸</span><div><strong>${it.wait}</strong><p>${it.why||''}</p></div></div></div>`;
  if(it.act)  return `<div class="ln f" data-o="${o}"><div class="n">${n}</div><div class="act">${it.act}</div>${it.why?`<div class="why">${it.why}</div>`:''}</div>`;
  return `<div class="ln f" data-o="${o}"><div class="n">${n}</div><div class="cmd" data-c="${esc(it.cmd).replace(/"/g,'&quot;')}"></div>${it.why?`<div class="why">${it.why}</div>`:''}${it.out?`<pre class="out">${colorOut(it.out)}</pre>`:''}</div>`;
}
function stepsHTML(s){
  const cols = s.cols.map(c=>({c, items:[]}));
  let o = 0;
  s.rows.forEach(r=>{ cols.forEach(col=>{ if(r[col.c]) col.items.push(itemHTML(r[col.c], r.n, o++)); }); });
  const widths = s.widths || (s.aside ? '1.7fr 1fr' : cols.map(()=>'1fr').join(' '));
  const colsHTML = cols.map(col=>`
    <div class="col col${col.c}" data-role="${col.c}">
      <div class="who"><span class="dot" style="background:${ROLE_COLOR[col.c]}"></span><span style="color:${ROLE_COLOR[col.c]}">${ROLE_NAME[col.c]}</span><span class="me">VOCÊ</span></div>
      <div class="term ${s.browser?'browser':''}"><div class="bar"><i></i><i></i><i></i><span>${s.browser?(s.url||'github.com'):'Terminal · VS Code'}</span></div><div class="body">${col.items.join('')}</div></div>
    </div>`).join('');
  const aside = s.aside ? `<div style="display:flex;flex-direction:column;gap:0;justify-content:flex-start">${s.aside}</div>` : '';
  return `<div class="slide">
    <div class="hd"><span class="tag ${s.tagc||''}">${s.tag}</span><h2>${s.h}</h2></div>
    <p class="sub">${s.sub}</p>
    <div class="grid" style="grid-template-columns:${widths}">${colsHTML}${aside}</div>
    ${s.foot||''}
  </div>`;
}

/* ===================== NAVEGAÇÃO ===================== */
let role = 'T';
try{ role = localStorage.getItem('gitRole') || 'T'; }catch(e){}
let cur = 0, typing = null;

function visible(){ return SLIDES.map((s,i)=>i).filter(i=>{ const r = SLIDES[i].role; return !r || role==='T' || role===r; }); }
function frags(el){
  return [...el.querySelectorAll('.f')].map((f,k)=>({f, o: f.dataset.o!==undefined ? +f.dataset.o : k}))
    .sort((a,b)=>a.o-b.o).map(x=>x.f);
}
function skippable(f){
  if(role==='T' || role==='C') return false;
  const col = f.closest('.col'); if(!col) return false;
  const r = col.dataset.role; return !(r===role || r==='AB');
}
function applyRole(el){
  el.querySelectorAll('.col').forEach(col=>{
    const r = col.dataset.role;
    const mine = role!=='T' && (r===role || (r==='AB' && (role==='A'||role==='B')));
    const dim = role!=='T' && role!=='C' && !mine;
    col.classList.toggle('dim', dim);
    col.classList.toggle('mine', mine);
  });
  el.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('sel', b.dataset.r===role));
}
function setFlow(el, n){
  const fl = el.querySelector('.flow'); if(!fl) return;
  for(let i=1;i<=4;i++){ fl.classList.toggle('s'+i, i<=n); fl.classList.toggle('at'+i, i===n); }
}
function finishCmd(ln){
  const c = ln.querySelector('.cmd');
  if(c){ c.classList.remove('typing'); c.innerHTML = hl(c.dataset.c.replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')); }
  ln.classList.add('done');
}
function scrollInto(f){
  const body = f.closest('.body'); if(!body) return;
  const top = f.offsetTop - body.offsetTop;
  const target = top + f.offsetHeight - body.clientHeight + 30;
  if(target > body.scrollTop) body.scrollTop = target;
}
function reveal(f, animate){
  f.classList.add('on');
  if(f.dataset.flow) setFlow(f.closest('.slide'), +f.dataset.flow);
  if(f.dataset.mail) document.getElementById('mockMail').classList.add('onn');
  if(f.classList.contains('chk')) f.classList.add('on');
  const c = f.querySelector('.cmd');
  if(c && animate){
    const raw = c.dataset.c.replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
    const txt = plain(raw); let k = 0;
    c.textContent=''; c.classList.add('typing');
    const t = { f, timer: setInterval(()=>{
      k++; c.textContent = txt.slice(0,k);
      if(k>=txt.length){ clearInterval(t.timer); typing=null; finishCmd(f); scrollInto(f); }
    }, 32) };
    typing = t;
  } else finishCmd(f);
  if(animate) setTimeout(()=>scrollInto(f), 30); else scrollInto(f);
}
function show(i, all){
  if(typing){ clearInterval(typing.timer); typing=null; }
  cur = i;
  SLIDES.forEach(s=>s.el.classList.remove('active'));
  const el = SLIDES[i].el;
  void el.offsetWidth; el.classList.add('active');
  applyRole(el);
  const fs = frags(el);
  fs.forEach(f=>{ f.classList.remove('on','done'); const c=f.querySelector('.cmd'); if(c){c.textContent='';} });
  el.querySelectorAll('.body').forEach(b=>b.scrollTop=0);
  setFlow(el, 0);
  const mm = el.querySelector('#mockMail'); if(mm) mm.classList.remove('onn');
  fs.forEach(f=>{ if(all || skippable(f)) reveal(f, false); });
  if(all) el.querySelectorAll('.body').forEach(b=>b.scrollTop=0);
  updateNav();
  try{ history.replaceState(null,'','#'+(i+1)); }catch(e){}
}
function next(){
  if(typing){ clearInterval(typing.timer); const f=typing.f; typing=null; finishCmd(f); scrollInto(f); return; }
  const el = SLIDES[cur].el;
  const pending = frags(el).find(f=>!f.classList.contains('on'));
  if(pending){ reveal(pending, true); updateNav(); return; }
  const v = visible(); const p = v.indexOf(cur);
  if(p < v.length-1) show(v[p+1], false);
}
function prev(){
  const v = visible(); const p = v.indexOf(cur);
  if(p > 0) show(v[p-1], true);
}
function updateNav(){
  const v = visible(); const p = Math.max(0, v.indexOf(cur));
  const el = SLIDES[cur].el, fs = frags(el), done = fs.filter(f=>f.classList.contains('on')).length;
  const frac = (p + (fs.length? done/fs.length : 1)) / v.length;
  document.querySelector('#prog i').style.width = (frac*100)+'%';
  document.getElementById('count').textContent = (p+1)+'/'+v.length;
  const rc = document.getElementById('roleChip');
  rc.textContent = 'Papel: ' + (role==='T'?'todos':role);
  rc.style.color = role==='A'?'var(--A)':role==='B'?'var(--B)':role==='C'?'var(--C)':'var(--tx)';
}
function setRole(r){
  role = r; try{ localStorage.setItem('gitRole', r); }catch(e){}
  applyRole(SLIDES[cur].el); updateNav();
}

/* role buttons */
document.querySelectorAll('.rbtn').forEach(b=>b.addEventListener('click', e=>{
  e.stopPropagation(); setRole(b.dataset.r);
  setTimeout(()=>{ const v=visible(); const p=v.indexOf(cur); if(p<v.length-1) show(v[p+1], false); }, 350);
}));
document.getElementById('roleChip').onclick = ()=>{ const v = visible(); show(SLIDES.findIndex(s=>s.isRole), false); };

/* cycle animation */
let cyc = 0;
setInterval(()=>{ const cs = document.querySelectorAll('#cyc .cstep'); cs.forEach((c,i)=>c.classList.toggle('hot', i===cyc)); cyc=(cyc+1)%cs.length; }, 1300);

/* events */
document.getElementById('bNext').onclick = next;
document.getElementById('bPrev').onclick = prev;
document.getElementById('bFull').onclick = ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
document.getElementById('stage').addEventListener('click', e=>{
  if(e.target.closest('.no-adv, button, a')) return;
  next();
});
document.addEventListener('keydown', e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ show(0,false); }
  else if(e.key==='f'||e.key==='F'){ document.getElementById('bFull').click(); }
  else if(e.key==='Escape'){ menu.classList.remove('open'); }
});
const menu = document.getElementById('menu'), mg = document.getElementById('mg');
document.getElementById('bMenu').onclick = ()=>{
  mg.innerHTML=''; visible().forEach((i,k)=>{
    const b=document.createElement('button'); b.innerHTML=`<span>${k+1}</span>${SLIDES[i].title}`;
    if(i===cur) b.className='cur';
    b.onclick=()=>{ menu.classList.remove('open'); show(i,false); }; mg.appendChild(b);
  }); menu.classList.toggle('open');
};
menu.addEventListener('click', e=>{ if(e.target===menu) menu.classList.remove('open'); });
